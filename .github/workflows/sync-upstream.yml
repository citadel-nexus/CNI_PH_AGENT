name: Sync upstream PostHog/code

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/main
        id: sync
        run: |
          set -euo pipefail

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/PostHog/code.git
          else
            git remote add upstream https://github.com/PostHog/code.git
          fi

          git fetch upstream main

          sync_branch="chore/sync-upstream-${GITHUB_RUN_ID}"
          git checkout -b "${sync_branch}"

          base_sha="$(git rev-parse HEAD)"
          conflict="false"

          set +e
          git merge upstream/main --no-edit
          merge_exit=$?
          set -e

          if [ "${merge_exit}" -ne 0 ]; then
            conflicted_files="$(git diff --name-only --diff-filter=U)"
            if [ -z "${conflicted_files}" ]; then
              echo "Merge failed for a non-conflict reason."
              exit 1
            fi

            while IFS= read -r file_path; do
              [ -z "${file_path}" ] && continue
              git add "${file_path}"
            done <<< "${conflicted_files}"

            git commit -m "chore: sync upstream PostHog/code (conflicts)"
            conflict="true"
          fi

          head_sha="$(git rev-parse HEAD)"
          echo "sync_branch=${sync_branch}" >> "$GITHUB_OUTPUT"
          echo "conflict=${conflict}" >> "$GITHUB_OUTPUT"

          if [ "${base_sha}" = "${head_sha}" ]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push --set-upstream origin "${sync_branch}"
          echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.sync.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: ${{ steps.sync.outputs.sync_branch }}
          CONFLICT: ${{ steps.sync.outputs.conflict }}
        run: |
          set -euo pipefail

          title="chore: sync upstream PostHog/code"
          body=$'Automated upstream sync from PostHog/code.\n\n- Source: upstream/main\n- Sync method: git fetch upstream && git merge upstream/main --no-edit'

          if [ "${CONFLICT}" = "true" ]; then
            body+=$'\n- Merge status: conflict markers committed for manual resolution.'
          else
            body+=$'\n- Merge status: clean merge.'
          fi

          existing_pr_number="$(gh pr list --base main --head "${SYNC_BRANCH}" --state open --json number --jq 'if length > 0 then .[0].number else "" end')"

          if [ -n "${existing_pr_number}" ]; then
            gh pr edit "${existing_pr_number}" --title "${title}" --body "${body}"
          else
            gh pr create --base main --head "${SYNC_BRANCH}" --title "${title}" --body "${body}"
          fi